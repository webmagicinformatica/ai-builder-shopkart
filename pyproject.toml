[project]
name = "ai-builder-shopkart"
version = "0.1.0"
description = "ShopKart Support Copilot: starter project for the AI Builder course (dabeer.ai)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.10.0",
    "openai==3.53.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
pythonpath = ["."]
