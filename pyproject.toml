[project]
name = "ai-builder-shopkart"
version = "0.1.0"
description = "ShopKart Support Copilot: starter project for the AI Builder course (dabeer.ai)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.10.0",
    "boto3==1.44.9",
    "fastapi==0.165.0",
    "fastembed==0.9.1",
    "mcp==2.3.0",
    "openai==3.53.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pdfplumber==0.11.10",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pypdfium2==5.15.2",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
agents = [
    "claude-agent-sdk==0.2.183",
    "openai-agents==0.24.0",
]
dev = [
    "pytest==9.2.0",
]
# Only what the deployed Copilot needs (labs deploy, tracing, loadtest): the Docker
# image installs this group alone, so it skips the RAG and PDF tools.
serve = [
    "anthropic==2.10.0",
    "boto3==1.44.9",
    "fastapi==0.165.0",
    "openai==3.53.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]
# Only what the remote ticket MCP server needs (lab mcp-remote).
mcp-serve = [
    "boto3==1.44.9",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "pyjwt[crypto]==2.15.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "labs", "capstone"]
pythonpath = ["."]
