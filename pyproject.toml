[project]
name = "ai-builder-shopkart"
version = "0.1.0"
description = "ShopKart Support Copilot: starter project for the AI Builder course (dabeer.ai)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.10.0",
    "fastembed==0.9.1",
    "mcp==2.3.0",
    "openai==3.53.0",
    "pdfplumber==0.11.10",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pypdfium2==5.15.2",
    "python-dotenv==1.2.4",
]

[dependency-groups]
agents = [
    "claude-agent-sdk==0.2.183",
    "openai-agents==0.24.0",
]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "labs"]
pythonpath = ["."]
